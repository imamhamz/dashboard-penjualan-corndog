<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Penjualan Corndog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Dashboard Penjualan Corndog</h1>
        <p class="subtitle">Data penjualan dan produk</p>

        <div class="cards">

            <div class="card">
                <h3>Total Produk</h3>
                <div id="totalProduk">0</div>
            </div>

            <div class="card">
                <h3>Total Transaksi</h3>
                <div id="totalTransaksi">0</div>
            </div>

            <div class="card">
                <h3>Total Penjualan</h3>
                <div id="totalPenjualan">Rp 0</div>
            </div>

        </div>

        <div class="section">
            <h2>Daftar Produk</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Produk</th>
                        <th>Kategori</th>
                        <th>Harga</th>
                    </tr>
                </thead>

                <tbody id="productTable">
                    <tr>
                        <td colspan="4">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
